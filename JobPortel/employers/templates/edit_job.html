<!DOCTYPE html>
{% load static %}

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Job | JobPortal</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

    <style>

        /* ================= RESET ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ================= BODY ================= */

        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #dbeafe,
                    #f8fafc
                );

            color: #172033;

            padding: 30px 20px;
        }


        /* ================= CONTAINER ================= */

        .page-container {

            width: 100%;

            max-width: 750px;

            margin: 0 auto;
        }


        /* ================= TOP BAR ================= */

        .top-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }


        .brand {

            font-size: 25px;

            font-weight: 700;

            color: #2563eb;
        }


        .back-btn {

            display: inline-block;

            text-decoration: none;

            color: #2563eb;

            background: #ffffff;

            border: 1px solid #dbe3ef;

            padding: 9px 13px;

            border-radius: 7px;

            font-size: 13px;

            font-weight: 600;

            transition: 0.2s;
        }


        .back-btn:hover {

            background: #eff6ff;
        }


        /* ================= CARD ================= */

        .edit-card {

            background: #ffffff;

            width: 100%;

            padding: 40px;

            border-radius: 18px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 15px 40px
                rgba(15, 23, 42, 0.10);
        }


        /* ================= TITLE ================= */

        .edit-card h1 {

            text-align: center;

            color: #172554;

            font-size: 27px;

            margin-bottom: 8px;
        }


        .description {

            text-align: center;

            color: #64748b;

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* ================= FORM ================= */

        .edit-form {

            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 18px;
        }


        /* ================= FORM GROUP ================= */

        .form-group {

            display: flex;

            flex-direction: column;

            gap: 7px;

            width: 100%;
        }


        .form-group label {

            color: #334155;

            font-size: 13px;

            font-weight: 600;
        }


        /* ================= INPUT ================= */

        .form-group input,
        .form-group textarea {

            width: 100%;

            max-width: 100%;

            border: 1px solid #dbe1ea;

            border-radius: 9px;

            outline: none;

            background: #ffffff;

            color: #172033;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 14px;

            padding: 0 14px;

            box-sizing: border-box;

            transition: 0.2s;
        }


        .form-group input {

            height: 48px;
        }


        .form-group textarea {

            min-height: 130px;

            padding: 13px 14px;

            resize: vertical;

            line-height: 1.5;
        }


        /* ================= FOCUS ================= */

        .form-group input:focus,
        .form-group textarea:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.10);
        }


        /* ================= TWO COLUMNS ================= */

        .form-row {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;

            width: 100%;
        }


        /* ================= BUTTONS ================= */

        .button-row {

            display: flex;

            gap: 10px;

            margin-top: 5px;
        }


        .update-btn,
        .cancel-btn {

            height: 50px;

            border-radius: 9px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            text-decoration: none;

            display: flex;

            align-items: center;

            justify-content: center;

            transition: 0.2s;
        }


        .update-btn {

            flex: 1;

            border: none;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );
        }


        .update-btn:hover {

            transform: translateY(-1px);

            box-shadow:
                0 7px 18px
                rgba(37, 99, 235, 0.25);
        }


        .cancel-btn {

            padding: 0 20px;

            color: #475569;

            background: #f1f5f9;

            border: 1px solid #e2e8f0;
        }


        .cancel-btn:hover {

            background: #e2e8f0;
        }


        /* ================= NOTE ================= */

        .form-note {

            text-align: center;

            color: #94a3b8;

            font-size: 12px;

            line-height: 1.5;

            margin-top: 3px;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            body {

                padding: 20px 15px;
            }


            .top-bar {

                margin-bottom: 15px;
            }


            .brand {

                font-size: 22px;
            }


            .edit-card {

                padding: 28px 22px;

                border-radius: 14px;
            }


            .edit-card h1 {

                font-size: 23px;
            }


            .form-row {

                grid-template-columns: 1fr;

                gap: 18px;
            }


            .button-row {

                flex-direction: column;
            }


            .cancel-btn {

                width: 100%;

                height: 48px;
            }

        }

    </style>

</head>


<body>


    <div class="page-container">


        <!-- ================= TOP BAR ================= -->

        <div class="top-bar">

            <div class="brand">
                JobPortal
            </div>


            <a href="{% url 'my_jobs' %}"
               class="back-btn">

                ← My Jobs

            </a>

        </div>


        <!-- ================= EDIT CARD ================= -->

        <div class="edit-card">


            <h1>
                Edit Job
            </h1>


            <p class="description">
                Update your job or internship details
                and save the changes.
            </p>


            <!-- ================= FORM ================= -->

            <form method="POST"
                  class="edit-form">

                {% csrf_token %}


                <!-- JOB TITLE -->

                <div class="form-group">

                    <label for="job_title">
                        Job Title
                    </label>

                    <input
                        type="text"
                        id="job_title"
                        name="job_title"
                        value="{{ job.job_title }}"
                        placeholder="Job Title"
                        required
                    >

                </div>


                <!-- COMPANY -->

                <div class="form-group">

                    <label for="company_name">
                        Company Name
                    </label>

                    <input
                        type="text"
                        id="company_name"
                        name="company_name"
                        value="{{ job.company_name }}"
                        placeholder="Company Name"
                        required
                    >

                </div>


                <!-- LOCATION + SALARY -->

                <div class="form-row">


                    <div class="form-group">

                        <label for="location">
                            Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            name="location"
                            value="{{ job.location }}"
                            placeholder="Location"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="salary">
                            Salary
                        </label>

                        <input
                            type="text"
                            id="salary"
                            name="salary"
                            value="{{ job.salary }}"
                            placeholder="Salary"
                            required
                        >

                    </div>


                </div>


                <!-- EXPERIENCE + SKILLS -->

                <div class="form-row">


                    <div class="form-group">

                        <label for="experience">
                            Experience
                        </label>

                        <input
                            type="text"
                            id="experience"
                            name="experience"
                            value="{{ job.experience }}"
                            placeholder="Experience"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="skills">
                            Skills
                        </label>

                        <input
                            type="text"
                            id="skills"
                            name="skills"
                            value="{{ job.skills }}"
                            placeholder="Required Skills"
                            required
                        >

                    </div>


                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Job Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Enter job description">{{ job.description }}</textarea>

                </div>


                <!-- BUTTONS -->

                <div class="button-row">


                    <a href="{% url 'my_jobs' %}"
                       class="cancel-btn">

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="update-btn">

                        Update Job

                    </button>


                </div>


                <p class="form-note">

                    Review the details carefully before updating the job.

                </p>


            </form>


        </div>


    </div>


</body>

</html>
