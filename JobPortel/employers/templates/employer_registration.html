<!DOCTYPE html>
{% load static %}

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employer Registration | JobPortal</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

    <style>

        /* ================= RESET ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ================= BODY ================= */

        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #dbeafe,
                    #f8fafc
                );

            padding: 20px;
        }


        /* ================= REGISTRATION CARD ================= */

        .register-container {

            width: 100%;

            max-width: 460px;

            background: #ffffff;

            padding: 40px;

            border-radius: 18px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 15px 40px
                rgba(15, 23, 42, 0.12);

            box-sizing: border-box;
        }


        /* ================= LOGO ================= */

        .logo {

            text-align: center;

            font-size: 29px;

            font-weight: 700;

            color: #2563eb;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 28px;
        }


        /* ================= TITLE ================= */

        .register-container h2 {

            text-align: center;

            font-size: 25px;

            color: #172033;

            margin-bottom: 8px;
        }


        .register-description {

            text-align: center;

            color: #64748b;

            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 25px;
        }


        /* ================= ERROR ================= */

        .error-message {

            width: 100%;

            background: #fef2f2;

            color: #dc2626;

            border: 1px solid #fecaca;

            padding: 11px 13px;

            border-radius: 8px;

            text-align: center;

            font-size: 13px;

            margin-bottom: 18px;

            box-sizing: border-box;
        }


        /* ================= FORM ================= */

        .register-container form {

            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 17px;

            margin: 0;

            padding: 0;

            box-sizing: border-box;
        }


        /* ================= INPUT GROUP ================= */

        .input-group {

            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 6px;

            margin: 0;

            padding: 0;

            box-sizing: border-box;
        }


        /* ================= LABEL ================= */

        .input-group label {

            display: block;

            width: 100%;

            color: #334155;

            font-size: 13px;

            font-weight: 600;

            box-sizing: border-box;
        }


        /* ================= INPUT ================= */

        .input-group input {

            display: block;

            width: 100%;

            max-width: 100%;

            height: 50px;

            padding: 0 15px;

            margin: 0;

            border: 1px solid #dbe1ea;

            border-radius: 9px;

            outline: none;

            font-size: 14px;

            font-family: Arial, Helvetica, sans-serif;

            color: #172033;

            background: #ffffff;

            box-sizing: border-box;

            transition: 0.2s;
        }


        /* ================= PLACEHOLDER ================= */

        .input-group input::placeholder {

            color: #94a3b8;
        }


        /* ================= INPUT FOCUS ================= */

        .input-group input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.10);
        }


        /* ================= REGISTER BUTTON ================= */

        .register-btn {

            display: block;

            width: 100%;

            max-width: 100%;

            height: 50px;

            margin: 4px 0 0 0;

            padding: 0 15px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: white;

            font-size: 15px;

            font-family: Arial, Helvetica, sans-serif;

            font-weight: 600;

            cursor: pointer;

            box-sizing: border-box;

            transition: 0.2s;
        }


        /* ================= BUTTON HOVER ================= */

        .register-btn:hover {

            transform: translateY(-1px);

            box-shadow:
                0 7px 18px
                rgba(37, 99, 235, 0.25);
        }


        .register-btn:active {

            transform: translateY(0);
        }


        /* ================= BOTTOM TEXT ================= */

        .bottom-text {

            width: 100%;

            text-align: center;

            margin-top: 23px;

            color: #64748b;

            font-size: 13px;

            line-height: 1.6;

            box-sizing: border-box;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 500px) {

            body {

                padding: 15px;
            }


            .register-container {

                max-width: 100%;

                padding: 30px 22px;

                border-radius: 14px;
            }


            .logo {

                font-size: 25px;
            }


            .register-container h2 {

                font-size: 22px;
            }


            .subtitle {

                font-size: 13px;
            }


            .register-description {

                font-size: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= REGISTRATION CARD ================= -->

    <div class="register-container">


        <!-- LOGO -->

        <div class="logo">
            JobPortal
        </div>


        <div class="subtitle">
            Connect with talented candidates
        </div>


        <!-- TITLE -->

        <h2>
            Employer Registration
        </h2>


        <p class="register-description">
            Create your employer account and start hiring talented students.
        </p>


        <!-- ERROR -->

        {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

        {% endif %}


        <!-- ================= FORM ================= -->

        <form method="POST">

            {% csrf_token %}


            <!-- COMPANY NAME -->

            <div class="input-group">

                <label for="company_name">
                    Company Name
                </label>

                <input
                    type="text"
                    id="company_name"
                    name="company_name"
                    placeholder="Enter company name"
                    autocomplete="organization"
                    required
                >

            </div>


            <!-- COMPANY EMAIL -->

            <div class="input-group">

                <label for="company_email">
                    Company Email
                </label>

                <input
                    type="email"
                    id="company_email"
                    name="company_email"
                    placeholder="Enter company email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="input-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                    autocomplete="tel"
                    required
                >

            </div>


            <!-- LOCATION -->

            <div class="input-group">

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    placeholder="Enter company location"
                    autocomplete="address-level2"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                class="register-btn">

                Create Employer Account

            </button>


        </form>


        <!-- ================= BOTTOM TEXT ================= -->

        <div class="bottom-text">

            Register as an employer to post jobs and hire students.

        </div>


    </div>


</body>

</html>
