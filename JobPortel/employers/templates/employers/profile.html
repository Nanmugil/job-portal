<!DOCTYPE html>
{% load static %}

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Logout | JobPortal</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

    <style>

        /* ================= RESET ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ================= BODY ================= */

        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #dbeafe,
                    #f8fafc
                );

            padding: 20px;
        }


        /* ================= LOGOUT CARD ================= */

        .logout-card {

            width: 100%;

            max-width: 450px;

            background: #ffffff;

            padding: 45px 40px;

            border-radius: 18px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 15px 40px
                rgba(15, 23, 42, 0.12);

            text-align: center;
        }


        /* ================= ICON ================= */

        .logout-icon {

            width: 75px;

            height: 75px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #dcfce7;

            color: #16a34a;

            font-size: 34px;

            font-weight: bold;
        }


        /* ================= LOGO ================= */

        .logo {

            color: #2563eb;

            font-size: 28px;

            font-weight: 700;

            margin-bottom: 20px;
        }


        /* ================= TITLE ================= */

        .logout-card h1 {

            color: #172033;

            font-size: 25px;

            margin-bottom: 10px;
        }


        /* ================= DESCRIPTION ================= */

        .logout-card p {

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }


        /* ================= BUTTON ================= */

        .login-btn {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            height: 50px;

            border-radius: 9px;

            text-decoration: none;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: #ffffff;

            font-size: 14px;

            font-weight: 600;

            transition: 0.2s;
        }


        .login-btn:hover {

            transform: translateY(-1px);

            box-shadow:
                0 7px 18px
                rgba(37, 99, 235, 0.25);
        }


        /* ================= FOOTER TEXT ================= */

        .footer-text {

            margin-top: 22px;

            color: #94a3b8;

            font-size: 12px;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 500px) {

            body {

                padding: 15px;
            }


            .logout-card {

                padding: 35px 22px;

                border-radius: 14px;
            }


            .logo {

                font-size: 25px;
            }


            .logout-card h1 {

                font-size: 22px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= LOGOUT CARD ================= -->

    <div class="logout-card">


        <!-- LOGO -->

        <div class="logo">
            JobPortal
        </div>


        <!-- SUCCESS ICON -->

        <div class="logout-icon">
            ✓
        </div>


        <!-- TITLE -->

        <h1>
            Logout Successful!
        </h1>


        <!-- MESSAGE -->

        <p>
            You have been logged out successfully.
            Thank you for using JobPortal.
        </p>


        <!-- LOGIN BUTTON -->

        <a href="/employers/login/"
           class="login-btn">

            Login Again

        </a>


        <!-- FOOTER -->

        <div class="footer-text">

            © 2026 JobPortal | Employer Portal

        </div>


    </div>


</body>

</html>
