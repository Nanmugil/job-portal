<!DOCTYPE html>
{% load static %}

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Employer Profile | JobPortal</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

    <style>

        /* ================= RESET ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ================= BODY ================= */

        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #dbeafe,
                    #f8fafc
                );

            color: #172033;

            padding: 25px 20px;
        }


        /* ================= CONTAINER ================= */

        .page-container {

            width: 100%;

            max-width: 700px;

            margin: 0 auto;
        }


        /* ================= TOP BAR ================= */

        .top-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .logo {

            font-size: 26px;

            font-weight: 700;

            color: #2563eb;
        }


        .back-btn {

            text-decoration: none;

            background: #ffffff;

            color: #2563eb;

            border: 1px solid #dbe3ef;

            padding: 10px 15px;

            border-radius: 8px;

            font-size: 13px;

            font-weight: 600;

            transition: 0.2s;
        }


        .back-btn:hover {

            background: #eff6ff;
        }


        /* ================= CARD ================= */

        .edit-card {

            background: #ffffff;

            padding: 40px;

            border-radius: 18px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 15px 40px
                rgba(15, 23, 42, 0.10);
        }


        /* ================= TITLE ================= */

        .edit-card h1 {

            text-align: center;

            color: #172554;

            font-size: 27px;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* ================= FORM ================= */

        .profile-form {

            display: flex;

            flex-direction: column;

            gap: 18px;
        }


        /* ================= FORM GROUP ================= */

        .form-group {

            display: flex;

            flex-direction: column;

            gap: 7px;
        }


        .form-group label {

            color: #334155;

            font-size: 13px;

            font-weight: 600;
        }


        /* ================= INPUT ================= */

        .form-group input {

            width: 100%;

            height: 50px;

            padding: 0 15px;

            border: 1px solid #dbe1ea;

            border-radius: 9px;

            outline: none;

            background: #ffffff;

            color: #172033;

            font-size: 14px;

            transition: 0.2s;
        }


        .form-group input::placeholder {

            color: #94a3b8;
        }


        .form-group input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.10);
        }


        /* ================= BUTTONS ================= */

        .button-row {

            display: flex;

            gap: 10px;

            margin-top: 7px;
        }


        .update-btn,
        .cancel-btn {

            height: 50px;

            border-radius: 9px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        /* ================= UPDATE ================= */

        .update-btn {

            flex: 1;

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: #ffffff;
        }


        .update-btn:hover {

            transform: translateY(-1px);

            box-shadow:
                0 7px 18px
                rgba(37, 99, 235, 0.25);
        }


        /* ================= CANCEL ================= */

        .cancel-btn {

            flex: 1;

            background: #f1f5f9;

            color: #475569;

            border: 1px solid #e2e8f0;
        }


        .cancel-btn:hover {

            background: #e2e8f0;
        }


        /* ================= NOTE ================= */

        .form-note {

            text-align: center;

            color: #94a3b8;

            font-size: 12px;

            margin-top: 2px;

            line-height: 1.5;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            body {

                padding: 18px 12px;
            }


            .top-bar {

                flex-direction: column;

                align-items: stretch;

                gap: 12px;
            }


            .logo {

                text-align: center;

                font-size: 23px;
            }


            .back-btn {

                text-align: center;
            }


            .edit-card {

                padding: 30px 22px;

                border-radius: 14px;
            }


            .edit-card h1 {

                font-size: 23px;
            }


            .button-row {

                flex-direction: column;
            }


            .update-btn,
            .cancel-btn {

                width: 100%;
            }

        }

    </style>

</head>


<body>


    <div class="page-container">


        <!-- ================= TOP BAR ================= -->

        <div class="top-bar">

            <div class="logo">
                JobPortal
            </div>


            <a href="{% url 'employer_profile' %}"
               class="back-btn">

                ← Profile

            </a>

        </div>


        <!-- ================= EDIT CARD ================= -->

        <div class="edit-card">


            <h1>
                Edit Company Profile
            </h1>


            <p class="subtitle">
                Update your company information and save
                the latest details.
            </p>


            <!-- ================= FORM ================= -->

            <form method="POST"
                  class="profile-form">

                {% csrf_token %}


                <!-- COMPANY NAME -->

                <div class="form-group">

                    <label for="company_name">
                        Company Name
                    </label>

                    <input
                        type="text"
                        id="company_name"
                        name="company_name"
                        value="{{ employer.company_name }}"
                        placeholder="Enter company name"
                        required
                    >

                </div>


                <!-- COMPANY EMAIL -->

                <div class="form-group">

                    <label for="company_email">
                        Company Email
                    </label>

                    <input
                        type="email"
                        id="company_email"
                        name="company_email"
                        value="{{ employer.company_email }}"
                        placeholder="Enter company email"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        value="{{ employer.phone }}"
                        placeholder="Enter phone number"
                        required
                    >

                </div>


                <!-- LOCATION -->

                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        value="{{ employer.location }}"
                        placeholder="Enter company location"
                        required
                    >

                </div>


                <!-- BUTTONS -->

                <div class="button-row">


                    <a href="{% url 'employer_profile' %}"
                       class="cancel-btn">

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="update-btn">

                        Update Profile

                    </button>


                </div>


                <p class="form-note">

                    Make sure all company details are correct
                    before updating your profile.

                </p>


            </form>


        </div>


    </div>


</body>

</html>
