<!DOCTYPE html>
{% load static %}

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employer Login | JobPortal</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

    <style>

        /* ================= RESET ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ================= BODY ================= */

        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #dbeafe,
                    #f8fafc
                );

            padding: 20px;
        }


        /* ================= LOGIN CARD ================= */

        .login-container {

            width: 100%;

            max-width: 430px;

            background: #ffffff;

            padding: 40px;

            border-radius: 18px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 15px 40px
                rgba(15, 23, 42, 0.12);

            box-sizing: border-box;
        }


        /* ================= LOGO ================= */

        .logo {

            text-align: center;

            font-size: 29px;

            font-weight: 700;

            color: #2563eb;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 28px;
        }


        /* ================= TITLE ================= */

        .login-container h2 {

            text-align: center;

            font-size: 25px;

            color: #172033;

            margin-bottom: 8px;
        }


        .login-description {

            text-align: center;

            color: #64748b;

            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 25px;
        }


        /* ================= ERROR ================= */

        .error-message {

            width: 100%;

            background: #fef2f2;

            color: #dc2626;

            border: 1px solid #fecaca;

            padding: 11px 13px;

            border-radius: 8px;

            text-align: center;

            font-size: 13px;

            margin-bottom: 18px;

            box-sizing: border-box;
        }


        /* ================= FORM ================= */

        .login-container form {

            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 17px;

            margin: 0;

            padding: 0;

            box-sizing: border-box;
        }


        /* ================= INPUT GROUP ================= */

        .input-group {

            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 6px;

            margin: 0;

            padding: 0;

            box-sizing: border-box;
        }


        /* ================= LABEL ================= */

        .input-group label {

            display: block;

            width: 100%;

            color: #334155;

            font-size: 13px;

            font-weight: 600;

            box-sizing: border-box;
        }


        /* ================= INPUT ================= */

        .input-group input {

            display: block;

            width: 100%;

            max-width: 100%;

            height: 50px;

            padding: 0 15px;

            margin: 0;

            border: 1px solid #dbe1ea;

            border-radius: 9px;

            outline: none;

            font-size: 14px;

            font-family: Arial, Helvetica, sans-serif;

            color: #172033;

            background: #ffffff;

            box-sizing: border-box;

            transition: 0.2s;
        }


        /* ================= PLACEHOLDER ================= */

        .input-group input::placeholder {

            color: #94a3b8;
        }


        /* ================= INPUT FOCUS ================= */

        .input-group input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.10);
        }


        /* ================= LOGIN BUTTON ================= */

        .login-btn {

            display: block;

            width: 100%;

            max-width: 100%;

            height: 50px;

            margin: 4px 0 0 0;

            padding: 0 15px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: white;

            font-size: 15px;

            font-family: Arial, Helvetica, sans-serif;

            font-weight: 600;

            cursor: pointer;

            box-sizing: border-box;

            transition: 0.2s;
        }


        /* ================= BUTTON HOVER ================= */

        .login-btn:hover {

            transform: translateY(-1px);

            box-shadow:
                0 7px 18px
                rgba(37, 99, 235, 0.25);
        }


        .login-btn:active {

            transform: translateY(0);
        }


        /* ================= BOTTOM TEXT ================= */

        .bottom-text {

            width: 100%;

            text-align: center;

            margin-top: 23px;

            color: #64748b;

            font-size: 13px;

            line-height: 1.6;

            box-sizing: border-box;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 500px) {

            body {

                padding: 15px;
            }


            .login-container {

                max-width: 100%;

                padding: 30px 22px;

                border-radius: 14px;
            }


            .logo {

                font-size: 25px;
            }


            .login-container h2 {

                font-size: 22px;
            }


            .subtitle {

                font-size: 13px;
            }


            .login-description {

                font-size: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= LOGIN CARD ================= -->

    <div class="login-container">


        <!-- LOGO -->

        <div class="logo">
            JobPortal
        </div>


        <div class="subtitle">
            Find talented students for your company
        </div>


        <!-- TITLE -->

        <h2>
            Employer Login
        </h2>


        <p class="login-description">
            Login to post jobs, view applicants and hire talented students.
        </p>


        <!-- ERROR -->

        {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

        {% endif %}


        <!-- ================= LOGIN FORM ================= -->

        <form method="POST">

            {% csrf_token %}


            <!-- COMPANY EMAIL -->

            <div class="input-group">

                <label for="company_email">
                    Company Email
                </label>

                <input
                    type="email"
                    id="company_email"
                    name="company_email"
                    placeholder="Enter company email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn">

                Login to Employer Account

            </button>


        </form>


        <!-- ================= BOTTOM TEXT ================= -->

        <div class="bottom-text">

            Login as an employer to manage jobs and hiring.

        </div>


    </div>


</body>

</html>
