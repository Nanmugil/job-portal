<!DOCTYPE html>
{% load static %}

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration | JobPortal</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #dbeafe,
                    #f8fafc
                );

            padding: 30px 15px;
        }

        /* ================= CONTAINER ================= */

        .register-container {
            width: 100%;
            max-width: 480px;

            background: white;

            padding: 38px 40px;

            border-radius: 18px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 15px 40px
                rgba(15, 23, 42, 0.12);
        }

        /* ================= LOGO ================= */

        .logo {
            text-align: center;

            font-size: 28px;

            font-weight: 700;

            color: #2563eb;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 28px;
        }

        /* ================= TITLE ================= */

        .register-container h2 {
            text-align: center;

            color: #172033;

            font-size: 25px;

            margin-bottom: 8px;
        }

        .register-description {
            text-align: center;

            color: #64748b;

            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 25px;
        }

        /* ================= ERROR ================= */

        .error-message {
            background: #fef2f2;

            color: #dc2626;

            border: 1px solid #fecaca;

            padding: 11px 13px;

            border-radius: 8px;

            font-size: 13px;

            margin-bottom: 18px;

            text-align: center;
        }

        /* ================= FORM ================= */

        form {
            display: flex;

            flex-direction: column;

            gap: 15px;
        }

        .input-group {
            display: flex;

            flex-direction: column;

            gap: 6px;
        }

        /* ================= LABEL ================= */

        .input-group label {
            font-size: 13px;

            font-weight: 600;

            color: #334155;
        }

        /* ================= INPUT ================= */

        .input-group input {
            width: 100%;

            height: 48px;

            padding: 0 14px;

            border: 1px solid #dbe1ea;

            border-radius: 9px;

            outline: none;

            font-size: 14px;

            font-family: Arial, Helvetica, sans-serif;

            color: #172033;

            background: white;

            transition: 0.2s;
        }

        .input-group input::placeholder {
            color: #94a3b8;
        }

        .input-group input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.10);
        }

        /* ================= REGISTER BUTTON ================= */

        .register-btn {
            width: 100%;

            height: 50px;

            margin-top: 5px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .register-btn:hover {
            transform: translateY(-1px);

            box-shadow:
                0 7px 18px
                rgba(37, 99, 235, 0.25);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        /* ================= LOGIN ================= */

        .login-text {
            text-align: center;

            margin-top: 22px;

            color: #64748b;

            font-size: 13px;
        }

        .login-link {
            display: inline-block;

            margin-top: 8px;

            color: #2563eb;

            text-decoration: none;

            font-weight: 600;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 500px) {

            body {
                padding: 20px 12px;
            }

            .register-container {
                padding: 30px 22px;

                border-radius: 14px;
            }

            .logo {
                font-size: 25px;
            }

            .register-container h2 {
                font-size: 22px;
            }

            .subtitle {
                font-size: 13px;
            }

            .register-description {
                font-size: 12px;
            }

        }

    </style>

</head>


<body>


<!-- ================= REGISTRATION CONTAINER ================= -->

<div class="register-container">


    <!-- LOGO -->

    <div class="logo">
        JobPortal
    </div>


    <div class="subtitle">
        Find your next career opportunity
    </div>


    <!-- TITLE -->

    <h2>
        Student Registration
    </h2>


    <p class="register-description">
        Create your account and start exploring jobs and internships.
    </p>


    <!-- ERROR -->

    {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

    {% endif %}


    <!-- FORM -->

    <form method="POST">

        {% csrf_token %}


        <!-- FULL NAME -->

        <div class="input-group">

            <label for="full_name">
                👤 Full Name
            </label>

            <input
                type="text"
                id="full_name"
                name="full_name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

        </div>


        <!-- EMAIL -->

        <div class="input-group">

            <label for="email">
                📧 Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                autocomplete="email"
                required
            >

        </div>


        <!-- PHONE -->

        <div class="input-group">

            <label for="phone">
                📞 Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                autocomplete="tel"
                required
            >

        </div>


        <!-- QUALIFICATION -->

        <div class="input-group">

            <label for="qualification">
                🎓 Qualification
            </label>

            <input
                type="text"
                id="qualification"
                name="qualification"
                placeholder="Example: B.E CSE"
                required
            >

        </div>


        <!-- COURSE -->

        <div class="input-group">

            <label for="course">
                📚 Course
            </label>

            <input
                type="text"
                id="course"
                name="course"
                placeholder="Example: Computer Science"
                required
            >

        </div>


        <!-- SKILLS -->

        <div class="input-group">

            <label for="skills">
                🛠️ Skills
            </label>

            <input
                type="text"
                id="skills"
                name="skills"
                placeholder="Example: Python, Django, SQL"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label for="password">
                🔐 Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                required
            >

        </div>


        <!-- REGISTER BUTTON -->

        <button
            type="submit"
            class="register-btn">

            Create Student Account

        </button>


    </form>


    <!-- LOGIN -->

    <div class="login-text">

        Already have an account?

        <br>

        <a
            href="{% url 'student_login' %}"
            class="login-link">

            Login as Student →

        </a>

    </div>


</div>


</body>

</html>
